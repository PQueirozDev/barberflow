# Only the declared Auth URLs/templates are managed here. Other properties stay unchanged.
project_id = "zekro"

[auth]
site_url = "https://zekro.vercel.app"
additional_redirect_urls = [
  "https://zekro.vercel.app/auth/callback",
  "https://zekro.vercel.app/auth/callback?next=/redefinir-senha",
  "https://barberflow-pqueirozdev.vercel.app/auth/callback",
  "https://barberflow-pqueirozdev.vercel.app/auth/callback?next=/redefinir-senha",
  "https://barberflow-lake.vercel.app/auth/callback",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/callback?next=/redefinir-senha",
]

[auth.email.template.confirmation]
subject = "Confirme seu email no Zekro"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Redefina sua senha no Zekro"
content_path = "./supabase/templates/recovery.html"
